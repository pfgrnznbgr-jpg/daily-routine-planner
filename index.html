<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Daily Routine Planner</title><link rel="manifest" href="manifest.json"><style>body{font-family:Arial;background:#0f172a;color:#fff;max-width:800px;margin:auto;padding:20px}input,select,button{padding:8px;margin:4px} .task{background:#1e293b;padding:10px;margin:6px;border-radius:8px}.high{color:#f87171}.medium{color:#fbbf24}.low{color:#4ade80}</style></head><body><h1>📋 Daily Routine Planner</h1><form id=f><input id=t placeholder=Task required><input id=d type=number placeholder=Mins required><select id=p><option>morning</option><option>afternoon</option><option>evening</option></select><select id=e><option value=high>High</option><option value=medium>Medium</option><option value=low>Low</option></select><button>Add</button></form><div id=list></div><button id=installBtn hidden>Install App</button><script>let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(dp){dp.prompt();}};let tasks=JSON.parse(localStorage.getItem('routine_tasks')||'[]');function save(){localStorage.setItem('routine_tasks',JSON.stringify(tasks));render()}f.onsubmit=x=>{x.preventDefault();tasks.push({id:Date.now(),title:t.value,duration:d.value,phase:p.value,energy:e.value,completed:false});f.reset();save()};function tog(id){tasks=tasks.map(a=>a.id==id?({...a,completed:!a.completed}):a);save()}function del(id){tasks=tasks.filter(a=>a.id!=id);save()}function render(){list.innerHTML='';tasks.forEach(a=>{let d=document.createElement('div');d.className='task';d.innerHTML=`<input type=checkbox ${a.completed?'checked':''} onchange='tog(${a.id})'> <b>${a.title}</b> (${a.duration} mins) <span class='${a.energy}'>${a.energy.toUpperCase()}</span> <button onclick='del(${a.id})'>✕</button>`;list.appendChild(d)})}render();if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script></body></html>
