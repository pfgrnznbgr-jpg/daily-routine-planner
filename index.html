<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Routine Planner</title>
<style>:root{--bg:#0f172a;--card-bg:#1e293b;--text:#f8fafc;--text-muted:#94a3b8;--border:#334155;--accent-morning:#f59e0b;--accent-afternoon:#3b82f6;--accent-evening:#8b5cf6;--success:#10b981}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}body{background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}.container{width:100%;max-width:700px}h1{text-align:center;margin-bottom:24px}.add-form{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;background:var(--card-bg);padding:15px;border-radius:12px;border:1px solid var(--border)}input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px}#taskTitle{flex:3}#taskDuration{width:100px}button{cursor:pointer}.btn-add{background:#fff;color:#000;border:none;padding:10px 16px;font-weight:bold;border-radius:8px}.section{margin-bottom:30px}.section-title{font-weight:700;margin-bottom:10px;text-transform:uppercase}.morning .section-title{color:var(--accent-morning)}.afternoon .section-title{color:var(--accent-afternoon)}.evening .section-title{color:var(--accent-evening)}.task-list{display:flex;flex-direction:column;gap:10px}.task-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}.task-left{display:flex;align-items:center;gap:10px}.checkbox{width:22px;height:22px;border:2px solid var(--text-muted);border-radius:4px;display:flex;justify-content:center;align-items:center;cursor:pointer}.completed .checkbox{background:var(--success);border-color:var(--success)}.completed .checkbox::after{content:'✓';color:white;font-weight:bold}.completed .task-title{text-decoration:line-through;color:var(--text-muted)}.badge{color:var(--text-muted);font-size:12px;background:rgba(255,255,255,.08);padding:4px 8px;border-radius:6px}.task-actions{display:flex;gap:6px}.icon-btn{background:none;border:none;color:var(--text-muted);font-size:16px;padding:4px 6px}.icon-btn:hover{color:white}</style>
</head><body><div class="container"><h1>📋 Daily Routine Planner</h1><form class="add-form" id="addTaskForm"><input type="text" id="taskTitle" placeholder="Routine title..." required><input type="number" id="taskDuration" placeholder="Mins" min="1" required><select id="taskPhase"><option value="morning">Morning</option><option value="afternoon">Afternoon</option><option value="evening">Evening</option></select><button type="submit" class="btn-add">Add</button></form><div class="section morning"><div class="section-title">Morning</div><div class="task-list" id="morningList"></div></div><div class="section afternoon"><div class="section-title">Afternoon</div><div class="task-list" id="afternoonList"></div></div><div class="section evening"><div class="section-title">Evening</div><div class="task-list" id="eveningList"></div></div></div><script>let tasks=JSON.parse(localStorage.getItem('routine_tasks'))||[{id:'1',title:'Morning Movement & Stretch',duration:20,phase:'morning',completed:false},{id:'2',title:'Deep Work Session',duration:90,phase:'morning',completed:false},{id:'3',title:'Midday Reset & Lunch',duration:45,phase:'afternoon',completed:false},{id:'4',title:'Admin & Email Catch-up',duration:30,phase:'afternoon',completed:false},{id:'5',title:'Evening Wind-down & Reading',duration:30,phase:'evening',completed:false}];function saveTasks(){localStorage.setItem('routine_tasks',JSON.stringify(tasks));render()}function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,completed:!t.completed}:t);saveTasks()}function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);saveTasks()}function moveTask(id,d){const i=tasks.findIndex(t=>t.id===id);const n=i+d;if(i>-1&&n>=0&&n<tasks.length){[tasks[i],tasks[n]]=[tasks[n],tasks[i]];saveTasks()}}document.getElementById('addTaskForm').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:Date.now().toString(),title:taskTitle.value.trim(),duration:parseInt(taskDuration.value),phase:taskPhase.value,completed:false});e.target.reset();saveTasks()});function render(){const lists={morning:morningList,afternoon:afternoonList,evening:eveningList};Object.values(lists).forEach(l=>l.innerHTML='');tasks.forEach(task=>{const card=document.createElement('div');card.className='task-card '+(task.completed?'completed':'');card.innerHTML=`<div class="task-left"><div class="checkbox" onclick="toggleTask('${task.id}')"></div><div class="task-title">${task.title}</div><span class="badge">${task.duration} mins</span></div><div class="task-actions"><button class="icon-btn" onclick="moveTask('${task.id}',-1)">↑</button><button class="icon-btn" onclick="moveTask('${task.id}',1)">↓</button><button class="icon-btn" onclick="deleteTask('${task.id}')">✕</button></div>`;lists[task.phase].appendChild(card)})}render();</script></body></html>
